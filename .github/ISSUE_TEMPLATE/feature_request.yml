name: 💡 Feature Request
description: got an idea? spill it
labels:
  - feature request
type: Feature

body:
  - type: markdown
    attributes:
      value: |
        ooh an idea 👀 tell me everything
  - type: checkboxes
    id: checks
    attributes:
      label: before we start
      options:
        - label: i searched the [existing issues](https://github.com/namidaco/namida/issues?q=is%3Aissue) (closed ones too), nobody asked for this yet
          required: true
        - label: i checked the latest [beta](https://github.com/namidaco/namida-snapshots/releases), it's not there already
          required: true
  - type: textarea
    id: problem
    attributes:
      label: what's bugging you
      description: the problem behind the idea, if there is one
      placeholder: i'm always frustrated when ...
  - type: textarea
    id: idea
    attributes:
      label: your idea
      description: what should namida do? mockups & sketches are very welcome
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: where in the app
      options:
        - Library & indexing
        - Playback & queue
        - Player & miniplayer
        - Playlists & history
        - Tags editor
        - Lyrics
        - YouTube
        - Downloads
        - Sync
        - Widgets & notification
        - Settings & backups
        - other / not sure
  - type: dropdown
    id: platforms
    attributes:
      label: platforms
      description: where do you want it
      multiple: true
      options:
        - Android
        - Windows
        - Linux
  - type: textarea
    id: alternatives
    attributes:
      label: other ways you thought of
  - type: textarea
    id: other_apps
    attributes:
      label: apps that do this well
      description: links or screenshots of how others did it
  - type: textarea
    id: extra
    attributes:
      label: anything else
