name: 🔧 Issue
description: little problem, not sure if it's a bug
title: "[ISSUE] Write the title here"
labels:
  - issue

body:
  - type: markdown
    attributes:
      value: |
        **this template is **ONLY** used for reporting small issues, use other templates for other stuff**
  - type: checkboxes
    attributes:
      label: Before reporting
      options:
        - label: I have searched the existing issues
          required: true
        - label: I have checked the [documentation](https://docs.namida.app)
          required: true
        - label: I have tried the latest [beta version](https://github.com/namidaco/namida-snapshots/releases), the issue still happens there
          required: true
  - type: textarea
    attributes:
      label: WHAT EXACTLY HAPPENED
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Screenshots
      description: upload any screenshot/video if u got, makes things easier
    validations:
      required: false
  - type: textarea
    attributes:
      label: Logs
      description: |
        Go to **Settings > About > Share Logs** and put it here.
        Logs help a lot in figuring out what went wrong, please include them if you can.
      value: |
        <details>
        <summary>Logs</summary>

        ```
        <Replace this line by pasting your logs here>
        ```
        
        </details>

    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Can't share logs?
      options:
        - label: I can't open the app to get the logs (crash on startup, app won't launch, etc)
          required: false
  - type: textarea
    attributes:
      label: Possible Solution
      description: any suggestions how could this be possibly fixed/implemented?
    validations:
      required: false
